name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run check:boundaries
      - run: bun run check:exports
      - run: bun run check:component-exports
      - run: bun test tests/unit tests/security tests/architecture
      - run: node ./scripts/with-ephemeral-postgres.mjs -- node ./scripts/run-bun-test-dir.mjs tests/integration
